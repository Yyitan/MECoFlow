model:
  model_name: CAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 8
  adapter_dim: 128

train:
  dataset: mit-states
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  train_batch_size: 64
  epochs: 15
  context_length: 8
  seed: 0
  val_metric: AUC
  save_final_model: True
  save_path: output/mit_didiff
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1
  use_diffusion_refine: true
  diff_loss_weight: 0.2
  diff_steps: 4
  diff_train_topk: 64
  diff_eval_topk: 128
  diff_hidden_dim: 512
  diff_time_dim: 128
  diff_dropout: 0.1
  diff_step_size: 1.0

test:
  open_world: true
  eval_batch_size: 64
  feasibility: feasibilities/feasibility_mit.pt
  threshold: 0.3625205941
  threshold_trials: 50
  beta: 0.85
  use_diffusion_refine: true
  diff_steps: 4
  diff_eval_topk: 128
  diff_step_size: 1.0
  load_model: output/mit_didiff/val_best.pt
