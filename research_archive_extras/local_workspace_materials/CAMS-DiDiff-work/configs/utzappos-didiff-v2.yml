model:
  model_name: CAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 9
  adapter_dim: 64

train:
  dataset: ut-zappos
  step_size: 1
  gamma: 0.5
  lr: 0.00025
  train_batch_size: 64
  epochs: 15
  context_length: 8
  seed: 0
  val_metric: AUC
  save_every_n: 100
  save_final_model: False
  save_path: output/utzappos_didiff_v2
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1
  use_diffusion_refine: true
  diff_loss_weight: 0.1
  diff_steps: 2
  diff_train_topk: 64
  diff_eval_topk: 64
  diff_hidden_dim: 512
  diff_time_dim: 128
  diff_dropout: 0.1
  diff_step_size: 0.5
  diff_zero_mean_delta: true
  diff_use_gate: true

test:
  open_world: true
  eval_batch_size: 64
  feasibility: feasibilities/feasibility_zp.pt
  threshold: 0.4705232256
  threshold_trials: 50
  beta: 0.65
  use_diffusion_refine: true
  diff_steps: 2
  diff_eval_topk: 64
  diff_step_size: 0.5
  diff_zero_mean_delta: true
  diff_use_gate: true
  load_model: output/utzappos_didiff_v2/val_best.pt
