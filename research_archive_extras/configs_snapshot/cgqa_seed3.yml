model:
  model_name: CAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 12  
  adapter_dim: 128

train:
  dataset: cgqa
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  train_batch_size: 64   
  epochs: 15
  context_length: 8
  seed: 3
  val_metric: AUC
  save_final_model: False
  save_path: output/cgqa_seed3
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1

test:
  open_world: true  # If it’s the open-world setting, just set it to "true"
  eval_batch_size: 64
  feasibility: feasibilities/feasibility_cgqa.pt
  threshold: 0.4228139529
  threshold_trials: 50
  beta: 0.85  
  load_model: output/cgqa_seed3/val_best.pt

