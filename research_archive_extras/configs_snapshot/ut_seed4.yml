model:
  model_name: CAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 9
  adapter_dim: 64

train:
  dataset: ut-zappos
  step_size: 1
  gamma: 0.5
  lr: 0.00025
  train_batch_size: 64   
  epochs: 15
  context_length: 8
  seed: 4
  val_metric: AUC
  save_final_model: False
  save_path: output/ut_seed4
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1

test:
  open_world: true   # If it’s the open-world setting, just set it to "true"
  eval_batch_size: 64  
  feasibility: feasibilities/feasibility_zp.pt 
  threshold: 0.4705232256
  threshold_trials: 50  
  beta: 0.65 

  load_model: output/ut_seed4/val_best.pt

